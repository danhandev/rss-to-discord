name: RSS to Discord

on:
  schedule:
    - cron: "0 */2 * * *"    # stream: 2시간마다
    - cron: "0 0 * * 1"      # digest: 월요일 09:00 KST
  workflow_dispatch:
    inputs:
      digest:
        description: "주간 다이제스트도 함께 발송"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rss-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          DIGEST: ${{ github.event.schedule == '0 0 * * 1' || inputs.digest }}
          DISCORD_WEBHOOK_DAILY: ${{ secrets.DISCORD_WEBHOOK_DAILY }}
          DISCORD_WEBHOOK_WEEKLY: ${{ secrets.DISCORD_WEBHOOK_WEEKLY }}
          DISCORD_WEBHOOK_FINANCE: ${{ secrets.DISCORD_WEBHOOK_FINANCE }}

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update state"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
