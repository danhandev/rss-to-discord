name: RSS to Discord

on:
  schedule:
    - cron: "0 */2 * * *"   # 2시간마다 (UTC 기준)
  workflow_dispatch:         # Actions 탭에서 수동 실행용

permissions:
  contents: write            # state.json 커밋용

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          DISCORD_WEBHOOK_KOREA: ${{ secrets.DISCORD_WEBHOOK_KOREA }}
          DISCORD_WEBHOOK_JAVA: ${{ secrets.DISCORD_WEBHOOK_JAVA }}
          DISCORD_WEBHOOK_GLOBAL: ${{ secrets.DISCORD_WEBHOOK_GLOBAL }}

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update state"
          git push
